[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bramex"
version = "0.1.0"
description = "Shared data pipeline for team BraMex, MITxT 2.980x Sports Analytics"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=14",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
    "floodlight==1.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
